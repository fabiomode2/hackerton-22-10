name: cleanup-preview

on:
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: Rama cuyo preview se borra
        required: true

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Branch slug
        id: slug
        env:
          RAW: ${{ github.event.ref || inputs.branch }}
        run: |
          SLUG=$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]' | sed 's#/#-#g; s#[^a-z0-9-]#-#g; s#--*#-#g; s#^-##; s#-$##')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Check deploy secret
        id: deploy_key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -n "$SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SSH_KEY no configurada; el poller del VPS limpia previews huérfanos."
          fi

      - name: Install SSH key
        if: steps.deploy_key.outputs.enabled == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add host key
        if: steps.deploy_key.outputs.enabled == 'true'
        run: ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Remove preview
        if: steps.deploy_key.outputs.enabled == 'true'
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "rm -rf '/srv/segunda-piel/previews/${{ steps.slug.outputs.slug }}'"
