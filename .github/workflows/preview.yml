name: deploy-preview

on:
  push:
    branches-ignore: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  DOMAIN: hack.cesura.duckdns.org
  DEPLOY_PATH: /srv/segunda-piel

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Branch slug
        id: slug
        run: |
          RAW="${GITHUB_REF_NAME}"
          SLUG=$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]' | sed 's#/#-#g; s#[^a-z0-9-]#-#g; s#--*#-#g; s#^-##; s#-$##')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static site
        env:
          PUBLIC_BASE: /preview/${{ steps.slug.outputs.slug }}/viewer/
        run: ./scripts/build-site.sh

      - name: Check deploy secret
        id: deploy_key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -n "$SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SSH_KEY no configurada; el poller del VPS publica esta rama."
          fi

      - name: Install SSH key
        if: steps.deploy_key.outputs.enabled == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add host key
        if: steps.deploy_key.outputs.enabled == 'true'
        run: ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload preview
        if: steps.deploy_key.outputs.enabled == 'true'
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"
          URL="https://$DOMAIN/preview/$SLUG/"
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "mkdir -p '$DEPLOY_PATH/previews/$SLUG'"
          rsync -az --delete dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$DEPLOY_PATH/previews/$SLUG/"
          echo "### Preview lista" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
