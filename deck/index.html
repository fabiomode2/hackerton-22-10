<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080A">
<meta name="color-scheme" content="dark">
<title>Segunda Piel — El probador que Vinted no tiene</title>
<meta name="description" content="Probador 3D para moda de segunda mano. Las medidas ya están en el anuncio; nosotros las convertimos en un espejo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307080A'/%3E%3Cellipse cx='16' cy='11' rx='6' ry='2.2' fill='none' stroke='%236FE3DB' stroke-width='1.4'/%3E%3Cellipse cx='16' cy='16' rx='8' ry='3' fill='none' stroke='%236FE3DB' stroke-width='1.4'/%3E%3Cellipse cx='16' cy='21' rx='5' ry='1.9' fill='none' stroke='%236FE3DB' stroke-width='1.4'/%3E%3C/svg%3E">

<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/deck.css">
<link rel="stylesheet" href="css/charts.css">
<link rel="stylesheet" href="css/demo.css">
</head>

<body>
<div class="deck-viewport">
  <div class="deck-stage" id="deckStage">

    <!-- Las slides se cargan desde manifest.js -->
    <div id="slides"></div>

    <div class="grain" aria-hidden="true"></div>
    <div class="progress" aria-hidden="true"><div class="progress__bar" id="progressBar"></div></div>

    <header class="deck-chrome deck-top">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><ellipse cx="16" cy="10" rx="6" ry="2.2"/><ellipse cx="16" cy="16" rx="8.5" ry="3.1"/><ellipse cx="16" cy="22" rx="5" ry="1.9"/></svg>
        <span class="brand__name">Segunda Piel</span>
      </div>
      <div class="deck-top__section" id="sectionLabel">INTRO</div>
      <div class="deck-top__right">PRODUCT DEMO · 2026</div>
    </header>

    <footer class="deck-chrome deck-bottom">
      <div class="deck-hint">← → · ESPACIO · O ÍNDICE · D DEMO · F PANTALLA COMPLETA</div>
      <div class="deck-count"><b id="slideCurrent">01</b> / <span id="slideTotal">--</span></div>
    </footer>

    <button class="demo__exit" id="demoExit" type="button" aria-label="Salir de la demo (Esc)" title="Salir de la demo (Esc)">Salir · Esc</button>

    <div class="overview" id="overview" aria-label="Índice de slides">
      <div class="overview__head">
        <div class="overview__title">Índice</div>
        <div class="overview__hint">Click para ir · O / Esc para cerrar</div>
      </div>
      <div class="overview__grid" id="overviewGrid"></div>
    </div>

  </div>
</div>

<noscript>
  <p style="color:#F2EFE8;font-family:monospace;padding:24px">Activa JavaScript para ver el deck.</p>
</noscript>

<script src="manifest.js"></script>
<script src="js/deck.js"></script>
</body>
</html>
