<!-- =========================================================
     00 · COVER
     Cambia el titular en .cover__title y la entradilla en
     .cover__lede. La tarjeta de producto usa .listing-card.
     ========================================================= -->
<section class="slide glow-teal" data-title="No compres a ciegas" data-section="INTRO">
  <div class="slide__inner cover">
    <div class="cover__copy">
      <div class="kicker reveal"><span>SEGUNDA PIEL</span><span class="kicker__dot"></span><span>PROBADOR 3D</span></div>
      <h1 class="cover__title">
        <span class="mask"><span>No compres</span></span>
        <span class="mask"><span class="em" style="--d:.1s">a ciegas.</span></span>
      </h1>
      <p class="lede cover__lede reveal" style="--d:.35s">El probador 3D para moda de segunda mano. Las medidas ya están en el anuncio; nosotros las convertimos en un espejo.</p>
      <div class="cover__meta reveal" style="--d:.5s">
        <span class="chip chip--teal">DEMO INTERACTIVA</span>
        <span class="mono">VINTED-FIRST · 2026</span>
      </div>
    </div>

    <div class="cover__visual">
      <div class="figure-wrap cover__figure">
        <div class="figure-rings">
          <svg viewBox="0 0 460 760" data-rings="body" data-color="ink" data-top="70" data-gap="38" aria-hidden="true"></svg>
          <svg viewBox="0 0 460 760" data-rings="garment" data-color="teal" data-dashed="true" data-top="70" data-gap="38" aria-hidden="true"></svg>
        </div>
      </div>

      <div class="listing-card cover__card">
        <div class="listing-card__media">
          <img src="assets/levis-501.jpg" alt="Levi's 501">
          <span class="badge">PRUEBA 3D</span>
        </div>
        <div class="listing-card__body">
          <span class="listing-card__brand">LEVI'S</span>
          <strong class="listing-card__title">501 original</strong>
          <div class="listing-card__row"><span class="price">25 €</span><span class="size">W32 L32</span></div>
        </div>
      </div>
    </div>
  </div>
</section>
