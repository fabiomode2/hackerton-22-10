<!-- =========================================================
     03 · STAT 25–30 %
     Lollipop / range comparison. Para cambiar los datos,
     edita los x2 de las líneas y los textos.
     ========================================================= -->
<section class="slide glow-amber stat-slide" data-title="25–30% moda" data-section="ESTADÍSTICAS">
  <div class="slide__inner">
    <div class="stat-head">
      <div class="kicker reveal">LA CATEGORÍA QUE MÁS DEVUELVE</div>
      <h2 class="stat-title reveal" style="--d:.08s">La moda devuelve <em>casi el doble</em> que el retail.</h2>
    </div>

    <div class="stat-stage stat-stage--full">
      <div class="chart-callout reveal" style="--d:.25s">
        <b>25–30<span>%</span></b>
        <small>moda online · vs. 15,8% retail</small>
      </div>

      <div class="lollipop reveal" style="--d:.15s">
        <svg viewBox="0 0 1480 560" role="img" aria-label="Comparativa de devoluciones: retail total 15,8%, online total 19,3%, moda online 25–30%">
          <!-- grid -->
          <g class="lollipop__grid">
            <line x1="300" y1="80" x2="300" y2="470"></line>
            <line x1="608.6" y1="80" x2="608.6" y2="470"></line>
            <line x1="917.1" y1="80" x2="917.1" y2="470"></line>
            <line x1="1225.7" y1="80" x2="1225.7" y2="470"></line>
          </g>

          <!-- axis -->
          <g class="lollipop__axis">
            <text x="300" y="520" text-anchor="middle">0%</text>
            <text x="608.6" y="520" text-anchor="middle">10%</text>
            <text x="917.1" y="520" text-anchor="middle">20%</text>
            <text x="1225.7" y="520" text-anchor="middle">30%</text>
          </g>

          <!-- retail -->
          <text class="lollipop__label" x="0" y="157">Retail total</text>
          <line class="lollipop__line" pathLength="100" x1="300" y1="150" x2="787.5" y2="150"></line>
          <circle class="lollipop__dot" cx="787.5" cy="150" r="11"></circle>
          <text class="lollipop__value" x="807" y="157">15,8%</text>

          <!-- online -->
          <text class="lollipop__label" x="0" y="297">Online total</text>
          <line class="lollipop__line" pathLength="100" x1="300" y1="290" x2="895.5" y2="290"></line>
          <circle class="lollipop__dot" cx="895.5" cy="290" r="11"></circle>
          <text class="lollipop__value" x="915" y="297">19,3%</text>

          <!-- fashion range -->
          <text class="lollipop__label" x="0" y="437">Moda online</text>
          <line class="lollipop__line" pathLength="100" x1="300" y1="430" x2="1071.4" y2="430"></line>
          <rect class="lollipop__range" x="1071.4" y="414" width="154.3" height="32" rx="16"></rect>
          <circle class="lollipop__dot lollipop__dot--main" cx="1071.4" cy="430" r="11"></circle>
          <circle class="lollipop__dot lollipop__dot--main" cx="1225.7" cy="430" r="11"></circle>
          <text class="lollipop__value lollipop__value--main" x="1245" y="437">25–30%</text>
        </svg>
      </div>

      <div class="stat-secondary reveal" style="--d:.4s">
        <b>56%</b>
        <span>de las marcas de moda está en ≥30% de devoluciones</span>
      </div>
    </div>

    <div class="slide__foot">NRF 2025 · Radial + Two Boxes 2025 · PwC</div>
  </div>
</section>
