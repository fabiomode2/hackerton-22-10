<!-- =========================================================
     09 · PRODUCTO
     Tres piezas, dos stats (6 medidas / 0 assets 3D) y un
     veredicto. Sin párrafos.
     ========================================================= -->
<section class="slide glow-teal" data-title="El producto" data-section="PRODUCTO">
  <div class="slide__inner">
    <div class="kicker reveal">EL PRODUCTO</div>
    <h2 class="stat-title reveal" style="--d:.08s">Tu cuerpo. La prenda. <em>El veredicto.</em></h2>

    <div class="product">
      <div class="product__item reveal" style="--d:.18s">
        <span class="num">01</span>
        <div class="figure-wrap product__figure">
          <div class="figure-rings figure-rings--static">
            <svg viewBox="0 0 360 620" data-rings="body" data-color="ink" data-top="40" data-gap="26" data-scale=".72" aria-hidden="true"></svg>
          </div>
        </div>
        <div class="product__meta"><h3>Tu cuerpo</h3><span class="mono">6 MEDIDAS</span></div>
      </div>

      <div class="product__item reveal" style="--d:.28s">
        <span class="num">02</span>
        <div class="figure-wrap product__figure">
          <div class="figure-rings figure-rings--static">
            <svg viewBox="0 0 360 620" data-rings="garment" data-color="teal" data-dashed="true" data-top="40" data-gap="26" data-scale=".74" aria-hidden="true"></svg>
          </div>
        </div>
        <div class="product__meta"><h3>La prenda</h3><span class="mono">0 ASSETS 3D</span></div>
      </div>

      <div class="product__item reveal" style="--d:.38s">
        <span class="num">03</span>
        <div class="verdict-card">
          <div class="verdict-card__head"><span>FIT RESULT</span><span>CONFIANZA 0,86</span></div>
          <div class="verdict-card__body">
            <div class="verdict-card__main"><b>Regular</b><span>+4 cm</span></div>
            <div class="verdict-card__sub">Talla recomendada: 32</div>
          </div>
          <div class="verdict-scale">
            <div class="verdict-scale__track"><i style="left:62%"></i></div>
            <div class="verdict-scale__labels"><span>−10 cm</span><span>óptimo</span><span>+20 cm</span></div>
          </div>
          <div class="heat-legend">
            <span class="heat-chip"><i style="background:#FF6B5A;color:#FF6B5A"></i>aprieta</span>
            <span class="heat-chip"><i style="background:#FFB05C;color:#FFB05C"></i>justo</span>
            <span class="heat-chip"><i style="background:#4ADE9B;color:#4ADE9B"></i>bien</span>
            <span class="heat-chip"><i style="background:#6EA8FF;color:#6EA8FF"></i>sobra</span>
          </div>
        </div>
        <div class="product__meta"><h3>El veredicto</h3><span class="mono">TALLA 32 · +4 CM</span></div>
      </div>
    </div>

    <div class="product__statement reveal" style="--d:.5s">No modelamos la ropa. <span class="em">La calculamos.</span></div>
  </div>
</section>
