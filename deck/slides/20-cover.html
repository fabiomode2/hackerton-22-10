<!-- =========================================================
     20 · COVER — outfit check
     Hero de landing: wordmark + mockup móvil. Sin párrafos.
     ========================================================= -->
<section class="slide oc-cover" data-title="outfit check" data-section="INTRO">
  <div class="slide__inner oc-cover__inner">

    <div class="oc-cover__copy">
      <div class="oc-cover__eyebrow reveal" style="--d:.05s">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.6 13.4 12 22l-2.4-2.4M3.4 10.6 12 2l2.4 2.4"/>
          <path d="M2 13V6a2 2 0 0 1 2-2h5l11 11-8 8L2 13Z"/>
          <circle cx="7.5" cy="7.5" r="1.4"/>
        </svg>
        <span>3D FIT</span>
        <span class="oc-cover__eyebrow-dot" aria-hidden="true"></span>
        <span>SECOND-HAND</span>
      </div>

      <h1 class="oc-cover__title" aria-label="outfit check">
        <span class="oc-cover__line-mask mask">
          <span class="oc-cover__word oc-cover__word--outfit" style="--d:.14s" aria-hidden="true">outfit</span>
        </span>
        <span class="oc-cover__line-mask mask">
          <span class="oc-cover__word oc-cover__word--check" style="--d:.22s" aria-hidden="true">check<span class="oc-cover__dot-end"></span></span>
        </span>
      </h1>

      <div class="oc-cover__tagline reveal" style="--d:.34s">
        <span class="oc-cover__tagline-rule" aria-hidden="true"></span>
        <p>La talla, <em>antes</em> de comprar.</p>
      </div>
    </div>

    <div class="oc-cover__visual reveal" style="--d:.18s" aria-label="Demo móvil de outfit check">
      <div class="oc-cover__halo" aria-hidden="true"></div>
      <div class="oc-cover__orbit" aria-hidden="true"></div>

      <div class="oc-cover__phone-tilt">
        <div class="oc-cover__phone-float">
          <div class="oc-cover__phone">
            <div class="oc-cover__phone-screen">
              <img src="assets/demo-shot.png" alt="Anuncio de una sudadera con el botón Pruébatelo en 3D en la demo móvil de outfit check" width="430" height="900">
              <span class="oc-cover__phone-glare" aria-hidden="true"></span>
            </div>
            <span class="oc-cover__phone-btn oc-cover__phone-btn--one" aria-hidden="true"></span>
            <span class="oc-cover__phone-btn oc-cover__phone-btn--two" aria-hidden="true"></span>
          </div>
        </div>
      </div>

      <div class="oc-cover__float oc-cover__float--fit reveal" style="--d:.46s">
        <div class="oc-cover__chip" aria-label="Fit 86 por ciento">
          <div class="oc-cover__chip-head">
            <span>FIT</span>
            <span class="oc-cover__chip-pip" aria-hidden="true"></span>
          </div>
          <div class="oc-cover__chip-value">86<span>%</span></div>
          <div class="oc-cover__chip-bar" aria-hidden="true"><i></i></div>
          <div class="oc-cover__chip-caption">AJUSTE 3D</div>
        </div>
      </div>

      <div class="oc-cover__float oc-cover__float--verdict reveal" style="--d:.56s">
        <div class="oc-cover__verdict" aria-label="Talla M, te queda">
          <span class="oc-cover__tag-hole" aria-hidden="true"></span>
          <div class="oc-cover__verdict-size">
            <span class="oc-cover__verdict-kicker">TALLA</span>
            <span class="oc-cover__verdict-m">M</span>
          </div>
          <div class="oc-cover__verdict-result">
            <span class="oc-cover__check" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3.2 8.4 3 3 6.6-7"/></svg>
            </span>
            <span>TE QUEDA</span>
          </div>
        </div>
      </div>

      <div class="oc-cover__float oc-cover__float--mini reveal" style="--d:.64s" aria-hidden="true">
        <div class="oc-cover__mini-tag">
          <span class="oc-cover__mini-hole"></span>
          <span>M</span>
        </div>
      </div>
    </div>

  </div>
</section>
