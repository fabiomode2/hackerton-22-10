<!-- =========================================================
     21 · PROBLEM — la talla no es una talla
     Titular editorial + foto. La imagen es la protagonista.
     ========================================================= -->
<section class="slide oc-problem" data-title="La talla M no es una talla" data-section="PROBLEMA">
  <div class="slide__inner oc-problem__inner">

    <div class="oc-problem__copy">
      <div class="oc-problem__eyebrow reveal" style="--d:.05s">EL PROBLEMA</div>

      <h2 class="oc-problem__title">
        <span class="oc-problem__line-mask mask">
          <span class="oc-problem__line oc-problem__line--sans" style="--d:.12s">La talla M</span>
        </span>
        <span class="oc-problem__line-mask mask">
          <span class="oc-problem__line oc-problem__line--serif" style="--d:.2s"><em>no</em> es una talla.</span>
        </span>
      </h2>

      <div class="oc-problem__rule reveal" style="--d:.3s" aria-hidden="true"></div>

      <div class="oc-problem__equation reveal" style="--d:.36s" aria-label="Tu cuerpo no es igual a la talla M">
        <span class="oc-problem__eq-label">TU CUERPO</span>
        <span class="oc-problem__eq-sign" aria-hidden="true">≠</span>
        <span class="oc-problem__eq-tag"><i aria-hidden="true"></i>TALLA M</span>
      </div>

      <div class="oc-problem__loop reveal" style="--d:.46s" aria-label="Compra, espera, no encaja, devuelve">
        <span>COMPRA</span><i aria-hidden="true">→</i>
        <span>ESPERA</span><i aria-hidden="true">→</i>
        <span>NO ENCAJA</span><i aria-hidden="true">→</i>
        <span class="oc-problem__loop-end">DEVUELVE</span>
      </div>
    </div>

    <div class="oc-problem__visual reveal" style="--d:.18s">
      <div class="oc-problem__halo" aria-hidden="true"></div>
      <div class="oc-problem__orbit" aria-hidden="true"></div>

      <div class="oc-problem__photo-wrap">
        <div class="oc-problem__photo">
          <div class="oc-problem__fallback" aria-hidden="true">
            <span class="oc-problem__fallback-kicker">TALLA / FALLO</span>
            <span class="oc-problem__fallback-m">M</span>
          </div>
          <img src="assets/fit-fail.jpg" alt="Persona con una prenda de talla M que le queda demasiado pequeña" width="700" height="800" onerror="this.style.display='none'">
        </div>

        <div class="oc-problem__tag" aria-label="Etiqueta de talla M, no encaja">
          <span class="oc-problem__tag-hole" aria-hidden="true"></span>
          <span class="oc-problem__tag-kicker">TALLA</span>
          <div class="oc-problem__tag-row">
            <span class="oc-problem__tag-size">M</span>
            <span class="oc-problem__tag-price">32,00 €</span>
          </div>
          <svg class="oc-problem__tag-slash" viewBox="0 0 236 154" fill="none" aria-hidden="true">
            <path d="M18 132C69 112 157 68 218 16" stroke="#FF6F5E" stroke-width="7" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="oc-problem__note" aria-label="No">
          <span>no.</span>
          <svg viewBox="0 0 100 8" fill="none" aria-hidden="true">
            <path d="M3 5.2C25 1.8 58 7 97 3.4" stroke="#FF6F5E" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </div>

        <span class="oc-problem__side-label" aria-hidden="true">TALLA / FALLO</span>
      </div>
    </div>

  </div>
</section>
